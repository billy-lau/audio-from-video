# Pinned FFmpeg builds bundled into packaged releases of Audio from Video.
#
# Each table is one (OS, architecture) target. packaging/fetch_ffmpeg.py downloads
# `url`, refuses to continue unless the SHA-256 matches `sha256`, and copies the
# `bin/` folder and license into the app bundle. Release builds also save, next to
# the installer, the binary archive itself plus two checksum-verified source
# archives: the FFmpeg source (`source_url`) and the FFmpeg-Builds recipe at the
# exact commit that produced the binaries (`build_recipe_url`). The recipe contains
# the build scripts, configure flags, and pinned versions of every library compiled
# into FFmpeg, including libmp3lame.
#
# To update a pin:
#   1. Pick the LAST build of a month at
#      https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases
#      Upstream keeps month-end builds for two years but deletes other daily
#      builds after 14 days, so never pin a mid-month build (or `latest`).
#   2. Use the LGPL *shared* variant (no GPL codecs; ffmpeg.exe and ffprobe.exe
#      share one set of DLLs).
#   3. Copy the asset URL and its SHA-256 from the release page.
#   4. Get the release tag's commit (gh api repos/FFmpeg-Builds/FFmpeg-Builds/git/ref/tags/<tag>)
#      for `build_recipe_commit`, and the full FFmpeg commit named in the asset
#      (the part after "-g") for `source_commit`.
#   5. Download both source archives and record their SHA-256 values.
#
# Note: the two source archives are GitHub's auto-generated tarballs
# (/archive/<commit>.tar.gz). GitHub doesn't promise their bytes stay identical
# forever, so a SHA-256 mismatch on one of them (and only them) may be a
# re-compression rather than different content. The build stops either way. To
# check, unpack the new and old tarballs and compare the files (for example, with
# `diff -r`); if they match, record the new SHA-256.

[windows-x64]
version = "n9.0.2-39-g7adfbe40dc"
license = "LGPL-3.0-or-later"
release = "autobuild-2026-10-31-12-59"
url = "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n9.0.2-39-g7adfbe40dc-win64-lgpl-shared-9.0.zip"
sha256 = "e907b01fa4783913151237e37df2a10fa97d99a1598a021bf59d4ae62ffed4c0"
archive_root = "ffmpeg-n9.0.2-39-g7adfbe40dc-win64-lgpl-shared-9.0"
executables = ["ffmpeg.exe", "ffprobe.exe"]
# FFmpeg source for this exact build.
source_commit = "7adfbe40dcde598f93a6963d2f7b22cd75202ccc"
source_url = "https://github.com/FFmpeg/FFmpeg/archive/7adfbe40dcde598f93a6963d2f7b22cd75202ccc.tar.gz"
source_sha256 = "4babda050dcfccb1194dd2a9e75b5e5ec1aa33b3e99d4f6a7106b6337b6b4a0c"
# FFmpeg-Builds scripts at the commit the release tag points to.
build_recipe_commit = "5031c6f1082414e53688d39e521849905071070d"
build_recipe_url = "https://github.com/FFmpeg-Builds/FFmpeg-Builds/archive/5031c6f1082414e53688d39e521849905071070d.tar.gz"
build_recipe_sha256 = "3d82bbb1dd436116034bb4d945245e5550dff0d89db0094e9af90382527c2c17"
