name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.15"
          - os: macos-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress

      - name: Verify FFmpeg and FFprobe
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run pytest
        run: pytest

  gui:
    name: GUI / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        include:
          # The desktop app needs Python 3.12+ on Linux (see gui/launcher.py).
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.15"
          - os: macos-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"
          # The desktop app still supports Python 3.11 on macOS and Windows. Only 3.11 can
          # reveal PySide6 refcount leaks (3.12+ made True and None immortal), so these
          # jobs run the guard test in tests/gui/test_00_pyside_refcount_leak.py for real.
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install FFmpeg and Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress

      - name: Verify FFmpeg and FFprobe
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install package with dev, GUI, and test-gui dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui,test-gui]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run pytest
        # Verbose, so a crash in native Qt code shows which test was running, and with
        # sys-level capture, so native error messages (from Qt or the C library) reach
        # the log instead of a capture file that is lost when the process aborts.
        env:
          PYTHONFAULTHANDLER: "1"
        run: pytest -v --capture=sys

      - name: Run layout tests with the native Windows platform
        # Offscreen Qt on Windows has no fonts, so the layout tests are skipped above and
        # run here with the real system font and DPI instead.
        # Runs even if the step above failed, so both results are visible.
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        env:
          QT_QPA_PLATFORM: windows
        run: pytest -v tests/gui/test_theme_and_layout.py
