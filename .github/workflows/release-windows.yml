name: Windows installer

# Builds the Windows installer (with FFmpeg bundled), smoke-tests it on a clean
# runner, and uploads the results as a workflow artifact. It never publishes a
# GitHub Release; download the artifact from the workflow run page instead.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path src/audio_from_video/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match __version__ $version"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }

      - name: Cache FFmpeg download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/windows/cache
          key: ffmpeg-${{ hashFiles('packaging/ffmpeg-manifest.toml') }}

      - name: Build installer
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Python python

      - name: Smoke-test installer
        shell: pwsh
        run: ./packaging/windows/smoke_test.ps1

      - name: Upload installer and release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-from-video-windows-x64
          path: build/windows/release/
          if-no-files-found: error
          retention-days: 30
